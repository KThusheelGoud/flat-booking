<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Your Stay - Sunrise Avenue</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
  <link rel="stylesheet" href="flat.css" />
  <style>
    /* Specific overrides for a immersive booking experience */
    .booking-split-container {
      min-height: 90vh;
      display: flex;
      align-items: center;
      padding: 40px 0;
    }
    .video-section {
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .booking-glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 35px;
    }
    .info-badge {
      background: rgba(241, 145, 22, 0.15);
      color: #f19116;
      padding: 8px 15px;
      border-radius: 10px;
      font-weight: 600;
      display: inline-block;
      margin-bottom: 10px;
    }
  </style>
</head>
<body class="bg-dark">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="index.html">Sunrise Avenue</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="apartments.html">Apartments</a></li>
        <li class="nav-item"><a class="nav-link" href="profile.html"> My Bookings</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
      </ul>
    </div>
  </nav>

  <div class="container booking-split-container">
    <div class="row w-100 m-0">
      
      <div class="col-lg-7 pr-lg-5 mb-5 mb-lg-0">
        <div class="video-section embed-responsive embed-responsive-16by9 mb-4">
          <iframe id="videoFrame" class="embed-responsive-item" allowfullscreen></iframe>
        </div>
        
        <div class="details-text p-2">
          <div class="d-flex align-items-center mb-3">
            <img src="https://assets.ccbp.in/frontend/static-website/flats-list-location-icon-img.png" width="20" height="20" class="mr-2" />
            <span id="location" class="text-light opacity-75"></span>
          </div>
          <h2 class="title text-warning mb-3">Property Description</h2>
          <p id="description" class="text-secondary leading-relaxed"></p>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="booking-glass-card shadow-2xl">
          <div class="info-badge">Booking Inquiry</div>
          <h1 id="flatPrice" class="h3 font-weight-bold text-white mb-2"></h1>
          <h2 id="slotPrice" class="h6 text-secondary mb-4"></h2>
          
          <form id="bookingForm">
            <div class="form-group">
              <label for="name" class="text-light small">Full Name</label>
              <input type="text" class="form-control bg-transparent text-white border-secondary" id="name" placeholder="John Doe" required>
            </div>
            <div class="form-group">
              <label for="email" class="text-light small">Email Address</label>
              <input type="email" class="form-control bg-transparent text-white border-secondary" id="email" placeholder="john@example.com" required>
            </div>
            <div class="form-group">
              <label for="phone" class="text-light small">Phone Number</label>
              <input type="tel" class="form-control bg-transparent text-white border-secondary" id="phone" placeholder="+91 XXXXX XXXXX" required>
            </div>
            <div class="form-group mb-4">
              <label for="date" class="text-light small">Preferred Visit Date</label>
              <input type="date" class="form-control bg-transparent text-white border-secondary" id="date" required>
            </div>
            
            <button type="submit" class="button btn-block py-3">Confirm Booking</button>
          </form>

          <div class="text-center mt-4">
            <a href="apartments.html" class="text-secondary small hover:text-warning"><i class="fas fa-arrow-left mr-1"></i> Back to Gallery</a>
          </div>
        </div>
      </div>

    </div>
  </div>

  <footer class="footer bg-dark text-light py-4 border-top border-secondary">
    <div class="container text-center">
      <p class="mb-0 text-muted">© 2026 Sunrise Avenue. All rights reserved.</p>
    </div>
  </footer>

  <div class="modal fade" id="confirmationModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content bg-dark border-secondary text-white">
        <div class="modal-header border-secondary bg-success">
          <h5 class="modal-title font-weight-bold"><i class="fas fa-check-circle mr-2"></i> Success!</h5>
          <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">×</span>
          </button>
        </div>
        <div class="modal-body py-4">
          <p id="confirmationMessage" class="h6"></p>
        </div>
        <div class="modal-footer border-secondary">
          <button type="button" class="button btn-sm" id="downloadReceipt"><i class="fas fa-file-download mr-1"></i> Receipt</button>
          <button type="button" class="btn btn-outline-light btn-sm" data-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="flat.js"></script>
</body>
</html>
