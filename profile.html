<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile - Sunrise Avenue</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
  <link rel="stylesheet" href="flat.css" />
  <style>
    .profile-header {
      padding: 60px 0;
      background: linear-gradient(135deg, rgba(241, 145, 22, 0.1), transparent);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 40px;
    }
    .stat-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      padding: 20px;
      text-align: center;
    }
    .history-table {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .history-table th {
      background: rgba(241, 145, 22, 0.1);
      color: #f19116;
      border: none;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 1px;
    }
    .history-table td {
      color: #fff;
      vertical-align: middle;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    .empty-state {
      padding: 80px 0;
      text-align: center;
      color: #666;
    }
  </style>
</head>
<body class="bg-dark text-white">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">Sunrise Avenue</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="apartments.html">Apartments</a></li>
          <li class="nav-item"><a class="nav-link active" href="profile.html">My Bookings</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="profile-header mt-5">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-8">
          <h1 class="display-4 font-weight-bold">Dashboard</h1>
          <p class="text-secondary">Manage your property inquiries and booking history.</p>
        </div>
        <div class="col-md-4">
          <div class="stat-card shadow-lg">
            <h3 id="totalBookings" class="text-warning mb-0">0</h3>
            <p class="small text-muted mb-0">Total Inquiries</p>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="container mb-5">
    <h2 class="h4 mb-4">Inquiry History</h2>
    <div class="history-table shadow-2xl">
      <table class="table table-dark mb-0">
        <thead>
          <tr>
            <th>Property</th>
            <th>Date</th>
            <th>Price</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="historyBody">
          </tbody>
      </table>
      <div id="emptyState" class="empty-state d-none">
        <i class="fas fa-folder-open fa-3x mb-3"></i>
        <p>No booking history found.</p>
        <a href="apartments.html" class="button btn-sm">Explore Properties</a>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const historyBody = document.getElementById("historyBody");
      const emptyState = document.getElementById("emptyState");
      const totalCount = document.getElementById("totalBookings");
      
      // Load from LocalStorage
      let history = JSON.parse(localStorage.getItem("bookingHistory")) || [];
      
      if (history.length === 0) {
        emptyState.classList.remove("d-none");
        return;
      }

      totalCount.textContent = history.length;

      history.forEach((item, index) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>
            <div class="d-flex align-items-center">
              <img src="${item.image}" width="50" height="40" class="rounded mr-3" style="object-fit: cover;">
              <span class="font-weight-bold">${item.flat}</span>
            </div>
          </td>
          <td>${item.date}</td>
          <td class="text-warning">${item.price}</td>
          <td><span class="badge badge-success px-3 py-2">Pending Contact</span></td>
          <td>
            <button onclick="deleteBooking(${index})" class="btn btn-outline-danger btn-sm">
              <i class="fas fa-trash"></i>
            </button>
          </td>
        `;
        historyBody.appendChild(row);
      });
    });

    function deleteBooking(index) {
      let history = JSON.parse(localStorage.getItem("bookingHistory")) || [];
      history.splice(index, 1);
      localStorage.setItem("bookingHistory", JSON.stringify(history));
      location.reload(); // Refresh to update view
    }
  </script>
</body>
</html>
